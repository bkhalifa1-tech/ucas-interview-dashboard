<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقابلات لجنة الأنشطة</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#202a42;font:16px/1.7 Tahoma,Arial,sans-serif}header,main{padding:18px max(5vw,20px)}header{background:white;display:flex;align-items:center;gap:16px;border-bottom:1px solid #ddd}b.brand{background:#242c56;color:white;padding:5px 12px;border-radius:9px}small{color:#666d86}main{max-width:1450px;margin:auto}section,article,dialog{background:white;border:1px solid #dce0eb;border-radius:16px;padding:24px}section{margin:18px 0}.hero{background:linear-gradient(110deg,#424573,#202a50);color:white;display:flex;align-items:center;justify-content:space-between;gap:16px}.hero h1{margin:0;font-size:clamp(28px,4vw,44px)}button,input,select,textarea{font:inherit;border:1px solid #d3d7e3;border-radius:8px;padding:8px 12px;background:white;color:inherit}button{cursor:pointer;color:#303660}.primary{background:#6560cf;color:white;border:none}.hero button{background:#dbd9ff;color:#272450}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}article strong{display:block;font-size:32px;color:#504bad}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}h2{font-size:21px;margin:0 0 12px}.bar h2{margin-inline-end:auto}table{width:100%;border-collapse:collapse;text-align:right}th,td{padding:12px;border-bottom:1px solid #eee}th{background:#f7f8fb}.scroll{overflow:auto}.empty{text-align:center;padding:32px;color:#646c83}dialog{width:min(720px,96vw);max-height:90vh;color:inherit}dialog::backdrop{background:#171c3c88}label{display:grid;margin:10px 0;gap:4px}fieldset{border:1px solid #ddd;border-radius:10px;margin:12px 0}textarea{min-height:64px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.hero{align-items:start;flex-direction:column}section,article{padding:16px}}header{background:#132d3c;color:white}.hero{background:linear-gradient(115deg,#126c71,#173e50);border:0}.brand{letter-spacing:1px}.grid article{border-top:4px solid #289b94}.grid strong{color:#145c62}th{background:#eaf3f3}button:hover{background:#dfefee}@media print{header,.hero,.grid,button,input,select,section:has(#template){display:none}}</style><header><b class="brand">UCAS IT CLUB</b> لجنة الأنشطة · فرع الطالبات</header><main><section class="hero"><div><small style="color:white">إدارة العضوية</small><h1>مقابلات لجنة الأنشطة</h1>فرع الطالبات · متابعة التقييم والمواعيد والقرارات</div></section><div class="grid" id="metrics"></div><section><label>استيراد سجل المرشحات من ملف UCAS-Interviews.html السابق<input id="importer" type="file" accept=".html"></label><div class="bar"><h2>سجل المرشحات</h2><input id="query" placeholder="ابحثي بالاسم أو الدور أو الموقع" oninput="render()"><select id="filter" onchange="render()"></select><button onclick="edit(-1)">إضافة مرشحة</button><button onclick="compare()">مقارنة</button><button onclick="window.print()">طباعة القائمة</button></div><div class="scroll"><table><thead><tr><th>تحديد</th><th>المرشحة</th><th>الفترة المقترحة</th><th>الدور المحتمل</th><th>القرار</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section><section><h2>نموذج المقابلة</h2><textarea id="template" style="width:100%;height:170px"></textarea><button onclick="localStorage.ucasTemplate=template.value;alert('تم حفظ النموذج للملفات الجديدة')">حفظ النموذج</button></section><small>تُحفظ التعديلات في هذا المتصفح. تاريخ المقابلات بانتظار التحديد.</small></main><dialog id="box"><form id="form"><h2>ملف المرشحة</h2><div id="fields"></div><button>حفظ الملف</button> <button type="button" onclick="box.close()">إغلاق</button></form></dialog><dialog id="sessionBox"><section id="sessionBody"></section><div class="bar"><button onclick="sessionBox.close()">إغلاق وحفظ المسودة</button><button class="primary" onclick="finishSession()">إنهاء المقابلة والمتابعة</button></div></dialog><dialog id="cmp"><div id="comparison"></div><button onclick="cmp.close()">إغلاق</button></dialog><script>const defaults="شو بتتوقعي من لجنة الأنشطة؟ ولو انضمّيتي إلنا، شو الشي اللي حابة يكون إلك أثر فيه؟\nلو مرّ أسبوع كامل وما كلفتك بأي مهمة، شو ممكن تعملي من نفسك كعضوة في اللجنة؟\nلو طلبت منك تقترحي نشاطًا تقنيًا، كيف رح تعرفي شو النشاط اللي الطلاب فعلًا محتاجينه؟ ومن وين رح تجيبي الأشخاص المناسبين لتنفيذه؟\nاحكيلي عن موقف قدمتي فيه فكرة أو اشتغلتي على مهمة، والشخص المسؤول عنك ما اقتنع بشغلك. كيف تعاملتي مع الموضوع؟\nلو طلبت منك تستلمي مسؤولية كاملة داخل اللجنة لمدة شهر، شو المسؤولية اللي بتشوفي حالك قادرة تستلميها؟ وكيف ممكن تثبتيلي إنك مناسبة إلها؟";const roster=[];const data=JSON.parse(localStorage.ucasInterviewRoster||JSON.stringify(roster)),states=['مرشحة للمقابلة','تحتاج مراجعة','مختارة','احتياط','مستبعدة'],criteria=['المبادرة','التعامل مع التقصير','التغيير المفاجئ','الالتزام الأسبوعي'];let current;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
template.value=localStorage.ucasTemplate??defaults;filter.innerHTML=['كل الحالات',...states].map(v=>'<option>'+v+'</option>').join('');
function render(){metrics.innerHTML=["المرشحات","مختارة","احتياط","مستبعدة"].map((v,i)=>"<article>"+v+"<strong>"+(i?data.filter(d=>d.status===v).length:data.length)+"</strong></article>").join("");rows.innerHTML=data.map((d,i)=>(!filter.selectedIndex||filter.value===d.status)&&[d.name,d.role,d.area].join(' ').includes(query.value)?'<tr><td><input type="checkbox" value="'+i+'"></td><td>'+esc(d.name)+'</td><td dir="ltr">'+esc(d.slot)+'</td><td>'+esc(d.role)+'</td><td>'+esc(d.status)+'</td><td><button class="primary" onclick="interview('+i+')">إجراء المقابلة</button> <button onclick="edit('+i+')">فتح الملف</button></td></tr>':'').join('')}
function edit(i){current=i;const d=data[i]||{questions:template.value};function f(k,t,opts){let el=opts?'<select name="'+k+'">'+opts.map(v=>'<option '+(v===d[k]?'selected':'')+'>'+v+'</option>').join('')+'</select>':'<textarea name="'+k+'" '+(k==='name'?'required':'')+'>'+esc(d[k])+'</textarea>';return '<label>'+t+el+'</label>'}
fields.innerHTML=f('name','اسم المرشحة')+f('contact','رقم الواتساب')+f('branch','الفرع والتحقق منه')+f('area','المنطقة')+f('attendance','القدرة على الحضور الميداني')+f('role','الدور المحتمل')+criteria.map((t,j)=>'<fieldset><legend>'+t+'</legend>'+f('a'+j,'الإجابة الأصلية')+f('s'+j,'التقييم',['غير مقيّم','0','1'])+f('r'+j,'مبرر الدرجة')+'</fieldset>').join('')+f('slot','الفترة المقترحة')+f('day','تاريخ المقابلة')+f('confirmation','حالة الموعد',['مقترح','مؤكد','إعادة جدولة','تمت المقابلة','لم تحضر'])+f('questions','أسئلة المقابلة')+f('answers','إجابات المقابلة')+f('notes','ملاحظات اللجنة')+f('status','القرار',states)+f('reason','مبرر القرار');box.showModal()}
form.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));for(let j=0;j<4;j++)if(d['s'+j]!=='غير مقيّم'&&(!d['r'+j].trim()||!d['a'+j].trim())){alert('أدخلي الإجابة ومبرر الدرجة');return}let idx=current<0?data.length:current;data[idx]={...data[idx],...d};localStorage.ucasInterviewRoster=JSON.stringify(data);box.close();render()};function compare(){let ds=[...rows.querySelectorAll(':checked')].map(x=>data[x.value]);if(ds.length<2)return alert('حددي مرشحتين على الأقل');comparison.innerHTML=ds.map(d=>'<article><h2>'+esc(d.name)+'</h2>'+criteria.map((t,i)=>'<p><b>'+t+'</b> · '+esc(d['s'+i]||'غير مقيّم')+'<br>'+esc(d['a'+i])+'<br>'+esc(d['r'+i])+'</p>').join('')+'</article>').join('');cmp.showModal()}let activeInterview;
function interview(i){
 activeInterview=i;
 const d=data[i],questions=(d.questions||defaults).split('\n').filter(Boolean);
 sessionBody.innerHTML='<small>المقابلة '+(i+1)+' من '+data.length+'</small><h2>'+esc(d.name)+'</h2><p>'+esc(d.slot)+' · '+esc(d.confirmation||'موعد مقترح')+' · '+esc(d.role||'الدور قيد التحقق')+'</p><details><summary>مراجعة إجابات طلب الانضمام</summary>'+criteria.map((t,j)=>'<p><b>'+t+'</b><br>'+esc(d['a'+j]||'غير موثّق')+'</p>').join('')+'</details>'+questions.map(q=>'<label>'+esc(q)+'<textarea data-question="'+esc(q)+'">'+esc(d.interviewResponses?.[q])+'</textarea></label>').join('')+'<label>قرار اللجنة<select id="liveDecision">'+states.map(v=>'<option '+(d.status===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label>مبرر القرار<textarea id="liveReason">'+esc(d.reason)+'</textarea></label><small id="saved"></small>';
 if(!sessionBox.open)sessionBox.showModal();sessionBox.scrollTop=0;
}
sessionBody.oninput=e=>{
 const d=data[activeInterview],el=e.target;
 if(el.dataset.question){d.interviewResponses??={};d.interviewResponses[el.dataset.question]=el.value}
 if(el.id==='liveDecision')d.status=el.value;
 if(el.id==='liveReason')d.reason=el.value;
 localStorage.ucasInterviewRoster=JSON.stringify(data);saved.textContent='حُفظت المسودة على هذا الجهاز';render()
};
function finishSession(){
 const d=data[activeInterview];if(['مختارة','احتياط','مستبعدة'].includes(d.status)&&!d.reason?.trim()){alert('سجّلي مبرر القرار أولًا');return}
 d.confirmation='تمت المقابلة';localStorage.ucasInterviewRoster=JSON.stringify(data);render();
 const next=data.findIndex((x,i)=>i>activeInterview&&x.confirmation!=='تمت المقابلة');if(next<0)sessionBox.close();else interview(next)
}
importer.onchange=async()=>{try{const raw=await importer.files[0].text();const match=raw.match(/const roster=(\[.*?\]);const data/s);const list=JSON.parse(match[1]);if(!Array.isArray(list)||!list.every(d=>typeof d.name==="string"))throw Error();for(const d of list)if(!data.some(x=>x.name===d.name))data.push(d);localStorage.ucasInterviewRoster=JSON.stringify(data);render();alert("تم استيراد السجل")}catch{alert("تعذّر قراءة سجل المرشحات من الملف")}};render()</script></html>
